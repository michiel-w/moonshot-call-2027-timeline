<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonshot Flanders — Call 2027 Timeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div id="stage" class="stage">
      <div class="today-badge">
        <span class="today-label">TODAY</span>
        <span id="currentDate" class="current-date">—</span>
      </div>

      <svg id="scene" viewBox="0 0 1200 720" role="img"
           aria-label="Rocket trajectory from Earth to the Moon, with the phases of Call 2027 marked along the path">
        <rect width="1200" height="720" fill="#FFFFFF"/>

        <!-- Earth: two partially overlapping circles, bottom left corner -->
        <g id="earth">
          <circle cx="105" cy="615" r="95" fill="#b8ddd1" opacity="0.5"/>
          <circle cx="195" cy="668" r="78" fill="#b8ddd1" opacity="0.5"/>
        </g>

        <!-- Moon image, top right (drawn moon as fallback) -->
        <g id="moon">
          <g id="moonFallback">
            <circle cx="1070" cy="120" r="75" fill="#DDDDDD"/>
            <circle cx="1045" cy="95" r="13" fill="#B8B8B8"/>
            <circle cx="1093" cy="137" r="9" fill="#C4C4C4"/>
            <circle cx="1060" cy="153" r="7" fill="#B8B8B8"/>
            <circle cx="1101" cy="97" r="6" fill="#C4C4C4"/>
            <circle cx="1037" cy="127" r="5" fill="#C4C4C4"/>
          </g>
          <image id="moonImage" href="assets/moon.webp" x="950" y="0" width="240" height="240"
                 preserveAspectRatio="xMidYMid meet" style="display:none"/>
        </g>

        <!-- Dotted trajectory from Earth to Moon -->
        <path id="trajectory" d="M 200 540 Q 620 55 975 205" fill="none"
              stroke="#54b897" stroke-width="4" stroke-linecap="round"
              stroke-dasharray="0.1 14"/>
        <path id="progress" d="M 200 540 Q 620 55 975 205" fill="none"
              stroke="#54b897" stroke-width="4" stroke-linecap="round"
              stroke-dasharray="0 100000"/>

        <g id="phases"></g>

        <!-- Rocket (logo image, with drawn fallback), positioned by script.js -->
        <g id="rocket">
          <g id="rocketFallback">
            <path class="flame" d="M -15 -5 L -32 0 L -15 5 Z" fill="#ff9f1a"/>
            <path d="M -15 -6 L 6 -6 L 20 0 L 6 6 L -15 6 Z" fill="#ecf0f1" stroke="#566573" stroke-width="1"/>
            <path d="M 6 -6 L 20 0 L 6 6 Z" fill="#fbaa00"/>
            <path d="M -15 -6 L -23 -13 L -12 -6 Z" fill="#fbaa00"/>
            <path d="M -15 6 L -23 13 L -12 6 Z" fill="#fbaa00"/>
            <circle cx="0" cy="0" r="3.4" fill="#74b9ff" stroke="#2e86c1" stroke-width="1.2"/>
          </g>
          <image id="rocketImage" href="assets/rocket.png" x="-26" y="-26" width="52" height="52"
                 preserveAspectRatio="xMidYMid meet" style="display:none"/>
        </g>
      </svg>

      <div id="tooltip" class="tooltip" role="tooltip" hidden>
        <div class="tt-date"></div>
        <div class="tt-title"></div>
        <div class="tt-text"></div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
